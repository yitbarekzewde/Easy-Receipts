<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        :root { font-family: Arial, sans-serif; color: #17352d; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef4f1; }
        .card { width: min(420px, calc(100% - 40px)); padding: 32px; background: #fff; border: 1px solid #d6e2dc; border-radius: 12px; box-shadow: 0 14px 34px rgba(23, 53, 45, .12); }
        h1 { margin-top: 0; }
        p { color: #52645e; line-height: 1.5; }
        label { display: block; margin: 16px 0 6px; font-weight: 700; }
        input, button { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 7px; font: inherit; }
        input { border: 1px solid #b8c9c1; }
        .password-field { position: relative; }
        .password-field input { padding-right: 44px; }
        .password-toggle { position: absolute; top: 50%; right: 8px; transform: translateY(-50%); width: 32px; height: 32px; margin: 0; padding: 5px; border: 0; background: transparent; color: #52645e; cursor: pointer; }
        .password-toggle:hover { color: #176b52; }
        .password-toggle svg { display: block; width: 20px; height: 20px; }
        button { margin-top: 16px; border: 0; background: #176b52; color: #fff; font-weight: 700; cursor: pointer; }
        button:disabled { opacity: .6; cursor: wait; }
        .secondary { background: transparent; color: #176b52; border: 1px solid #176b52; }
        .hidden { display: none; }
        #status { min-height: 24px; margin-top: 16px; font-weight: 700; }
        .error { color: #a33a31; }
        .success { color: #176b52; }
    </style>
<script src="notification.js"></script>
</head>
<body>
    <main class="card">
        <h1>Reset your password</h1>
        <p>Request a one-time code, then use it to choose a new password.</p>
        <form id="request-form">
            <label for="email">Email address</label>
            <input id="email" type="email" autocomplete="email" required>
            <button type="submit">Send reset code</button>
        </form>
        <form id="reset-form" class="hidden">
            <label for="otp">Reset code</label>
            <input id="otp" inputmode="numeric" autocomplete="one-time-code" required>
            <label for="new-password">New password</label>
            <div class="password-field">
                <input id="new-password" type="password" minlength="6" autocomplete="new-password" required>
                <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
                </button>
            </div>
            <label for="confirm-password">Confirm new password</label>
            <div class="password-field">
                <input id="confirm-password" type="password" minlength="6" autocomplete="new-password" required>
                <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
                </button>
            </div>
            <button type="submit">Reset password</button>
            <button id="resend-button" class="secondary" type="button">Resend code</button>
        </form>
        <div id="status" aria-live="polite"></div>
        <p><a href="login.html">Back to login</a></p>
    </main>
    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyvSKWrf9RYexa6nySHIQwr2JP-rtqk4k_vWCAJh6GumAPHnZEQLDosVpM7FbDxgq_KYw/exec';
        const email = document.getElementById('email');
        const status = document.getElementById('status');
        const requestForm = document.getElementById('request-form');
        const resetForm = document.getElementById('reset-form');

        document.querySelectorAll('.password-toggle').forEach(function (toggle) {
            toggle.addEventListener('click', function () {
                const input = toggle.parentElement.querySelector('input');
                const isVisible = input.type === 'text';
                input.type = isVisible ? 'password' : 'text';
                toggle.setAttribute('aria-label', isVisible ? 'Show password' : 'Hide password');
                toggle.setAttribute('aria-pressed', String(!isVisible));
            });
        });

        requestForm.addEventListener('submit', async function (event) {
            event.preventDefault();
            await sendCode();
        });

        resetForm.addEventListener('submit', async function (event) {
            event.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            if (newPassword !== document.getElementById('confirm-password').value) {
                showStatus('Passwords do not match.', true);
                return;
            }
            setBusy(true);
            try {
                const result = await request({ action: 'resetPassword', email: email.value.trim(), otp: document.getElementById('otp').value.trim(), newPassword });
                if (!result || !result.success) throw new Error(result && result.message ? result.message : 'Password reset failed.');
                showStatus('Password reset successfully. You can now log in.', false);
                setTimeout(() => { window.location.href = 'login.html'; }, 900);
            } catch (error) {
                showStatus(error.message || 'Password reset failed. Please try again.', true);
                setBusy(false);
            }
        });

        document.getElementById('resend-button').addEventListener('click', sendCode);

        async function sendCode() {
            if (!email.value.trim()) { showStatus('Enter your email address first.', true); return; }
            setBusy(true);
            try {
                const result = await request({ action: 'sendResetOTP', email: email.value.trim() });
                if (!result || !result.success) throw new Error(result && result.message ? result.message : 'Could not send reset code.');
                requestForm.classList.add('hidden');
                resetForm.classList.remove('hidden');
                showStatus('Reset code sent to your email.', false);
            } catch (error) {
                showStatus(error.message || 'Could not send reset code.', true);
            } finally {
                setBusy(false);
            }
        }

        async function request(payload) {
            const response = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            return response.json();
        }

        function setBusy(isBusy) {
            document.querySelectorAll('button').forEach(button => { button.disabled = isBusy; });
        }

        function showStatus(message, isError) {
            status.textContent = message;
            status.className = isError ? 'error' : 'success';
        }
    </script>
</body>
</html>
