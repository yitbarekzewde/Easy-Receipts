<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(90deg, #0ace14, #cdfa04, #f72702, rgb(90, 172, 101));
            background-size: 400% 400%;
            animation: gradientAnimation 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-shadow: inset -10px 30px 60px rgba(39, 4, 240, 0.1);         
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            -100% { background-position: 0% 50%; }
        }
        .left-navigation-arrow {
        position: absolute;
        top: 20px;
        left: 20px;
        cursor: pointer;
        color: #cdfa06ef;
    }
        h1 {
            color: #333;
            font-weight: bold;
        }

        label {
            display: flex;
            margin-bottom: 2px;
            color: #0c67cf;
            font-weight: bold;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: large;
        }

        .login-form {
            background: rgba(235, 238, 236, 0.9);
            padding: 50px;
            border-radius: 10px;
            border-color: linear-gradient(1800deg, #08fa28, #ffef09 #f70b0b);
            border-start-start-radius: 70px;
            border-bottom-right-radius: 70px;
            box-shadow: 0 0 20px rgba(241, 3, 3, 0.1);
            width: 300px;
            text-align: center;
            box-shadow: inset 0 0 100px rgba(7, 31, 243, 0.925);
            background-color: linear-gradient(180deg, #08fa28, #ffef09 #f70b0b);
            animation: gradientAnimation 15s ease infinite;
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100%  }
            100% { background-position: 50%; }
        }

        .login-form h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .login-form input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;

        }
        .login-form input:focus {
            border-color: #007bff;
            outline: none;
            top: auto;
        }
        .password-field { position: relative; }
        .password-field input { padding-right: 42px; }
        .password-toggle { position: absolute; top: 50%; right: 8px; transform: translateY(-50%); width: 32px !important; height: 32px; margin: 0 !important; padding: 5px !important; background: transparent !important; color: #52606d !important; font-size: 16px !important; }
        .password-toggle:hover { color: #007bff !important; }
        .password-toggle svg { display: block; width: 20px; height: 20px; }

        .login-form button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(90deg, #0ace14, #cdfa04, #f72702, rgb(30, 248, 40));
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 19px;
            margin-top: 15px;
        }


        .login-form button:hover {
            background: #5a6fd8;
        }

        .switch-link {
            display: block;
            margin-top: 15px;
            color: #0c67cf;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .switch-link:hover {
            text-decoration: underline;
        }
    </style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="notification.js"></script>
</head>
<body>
    <i class="left-navigation-arrow" onclick="window.location.href='reg-form.html'" title="Back to app">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-arrow-left">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </i>
    <div class="login-form">
        <h1>Welcome Back!</h1>
        <h2>Login</h2>
        <form action="#" method="post">
            <label for="username">Email</label>
            <input type="email" name="username" placeholder="you@example.com" required>
            <label for="password">Password </label>
            <div class="password-field">
                <input type="password" name="password" placeholder="Password" required>
                <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
                </button>
            </div>
            <button type="submit">Login</button>
        </form>
        <div id="google-login-options">
            <p>Or sign in with Google</p>
            <div id="g_id_onload"
                data-client_id="290599167080-9bslph3ri9p0v4kbhu2qlnja85sncvcd.apps.googleusercontent.com"
                data-callback="handleLoginGoogleCredential" data-auto_prompt="false"></div>
            <div class="g_id_signin" data-type="standard" data-size="large"></div>
        </div>
        <a class="switch-link" onclick="window.location.href='reg-form.html'">Don't have an account? Register</a>
        <a class="forgatepass" onclick="window.location.href='forgot-password.html'">Forgot Password?</a>
    </div>

    
    <script>
        document.querySelectorAll('.password-toggle').forEach(function (toggle) {
            toggle.addEventListener('click', function () {
                const input = toggle.parentElement.querySelector('input');
                const isVisible = input.type === 'text';
                input.type = isVisible ? 'password' : 'text';
                toggle.setAttribute('aria-label', isVisible ? 'Show password' : 'Hide password');
                toggle.setAttribute('aria-pressed', String(!isVisible));
            });
        });
    </script>
    <script type="module">
        import { auth } from './firebase-config.js';
        import { GoogleAuthProvider, linkWithCredential, onAuthStateChanged, signInWithCredential, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js';

        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby7yEM8uurq1uAogomMp_f6FYK4cYf5A2HV9YJSwiBvsbBrNNAVwbFbosbAis8SfuG4/exec';
        const PENDING_GOOGLE_TOKEN = 'pendingGoogleLinkToken';
        const PENDING_GOOGLE_EMAIL = 'pendingGoogleLinkEmail';
        let loginAttemptInProgress = false;
        onAuthStateChanged(auth, user => {
            if (loginAttemptInProgress) return;
            if (user?.emailVerified) {
                window.location.href = 'index.html';
                return;
            }
            if (user) void signOut(auth);
            localStorage.removeItem('isLoggedIn');
        });

        // Add JavaScript for form validation and credential checking
        document.querySelector('form').addEventListener('submit', function(event) {
            event.preventDefault();

            var username = document.querySelector('input[name="username"]').value.trim();
            var password = document.querySelector('input[name="password"]').value;

            if (username === '' || password === '') {
                alert('Please fill in all fields.');
                return;
            }

            loginAttemptInProgress = true;
            signIn(username, password);
        });

        async function signIn(email, password) {
            try {
                var credential = await signInWithEmailAndPassword(auth, email, password);
                if (!credential.user.emailVerified) {
                    await signOut(auth);
                    localStorage.setItem('pendingVerificationEmail', credential.user.email);
                    alert('Please verify your email before logging in.');
                    window.location.href = 'email-verification.html';
                    return;
                }
                const user = await linkPendingGoogleAccount(credential.user);
                await completeLogin(user, user.providerData.some(provider => provider.providerId === 'google.com') ? 'google' : 'email');
            } catch (error) {
                loginAttemptInProgress = false;
                logActivity(email, 'Failed Login', 'Incorrect email or password', '', email);
                void notifyAuthEvent('login-failed', { email: email });
                const invalidPassword = ['auth/invalid-credential', 'auth/wrong-password', 'auth/user-not-found'].includes(error.code);
                const linkFailed = sessionStorage.getItem(PENDING_GOOGLE_TOKEN) && !invalidPassword;
                alert(linkFailed ? (error.message || 'Could not link Google. Sign in with Google again to retry.') : 'Incorrect email or password. Please try again.');
            }
        }

        window.handleLoginGoogleCredential = async response => {
            if (loginAttemptInProgress) return;
            loginAttemptInProgress = true;
            try {
                let user;
                try {
                    const credential = await signInWithCredential(auth, GoogleAuthProvider.credential(response.credential));
                    user = credential.user;
                } catch (error) {
                    if (error.code !== 'auth/account-exists-with-different-credential') throw error;
                    const email = error.customData?.email || googleCredentialEmail(response.credential);
                    sessionStorage.setItem(PENDING_GOOGLE_TOKEN, response.credential);
                    sessionStorage.setItem(PENDING_GOOGLE_EMAIL, String(email || '').toLowerCase());
                    const emailInput = document.querySelector('input[name="username"]');
                    if (emailInput && email) emailInput.value = email;
                    alert('An email-and-password account already uses this Google email. Sign in with that password to link Google. Verify your email first if prompted.');
                    return;
                }
                await completeLogin(user, 'google');
            } catch (error) {
                alert(error.message || 'Google sign-in failed. Please try again.');
            } finally {
                loginAttemptInProgress = false;
            }
        };

        async function linkPendingGoogleAccount(user) {
            const token = sessionStorage.getItem(PENDING_GOOGLE_TOKEN);
            if (!token) return user;
            const pendingEmail = sessionStorage.getItem(PENDING_GOOGLE_EMAIL);
            if (!user.emailVerified) {
                await signOut(auth);
                throw new Error('Verify your email before linking Google to this account.');
            }
            if (!pendingEmail || pendingEmail !== String(user.email || '').toLowerCase()) {
                await signOut(auth);
                throw new Error('Sign in with the email-and-password account matching the Google email.');
            }
            if (user.providerData.some(provider => provider.providerId === 'google.com')) {
                sessionStorage.removeItem(PENDING_GOOGLE_TOKEN);
                sessionStorage.removeItem(PENDING_GOOGLE_EMAIL);
                return user;
            }
            try {
                const result = await linkWithCredential(user, GoogleAuthProvider.credential(token));
                sessionStorage.removeItem(PENDING_GOOGLE_TOKEN);
                sessionStorage.removeItem(PENDING_GOOGLE_EMAIL);
                return result.user;
            } catch (error) {
                await signOut(auth);
                throw error;
            }
        }

        async function completeLogin(user, provider) {
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('currentUser', JSON.stringify({ uid: user.uid, username: user.displayName || user.email, email: user.email }));
            localStorage.setItem('p3_user_profile', JSON.stringify({
                name: user.displayName || user.email,
                email: user.email,
                provider
            }));
            logActivity(user.displayName || user.email, 'Logged In', 'Signed in successfully', user.uid, user.email);
            await notifyAuthEvent('login-success', {
                idToken: await user.getIdToken(),
                device: await getDeviceDetails()
            });
            window.location.href = 'index.html';
        }

        function googleCredentialEmail(token) {
            try {
                const encoded = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
                return JSON.parse(atob(encoded)).email || '';
            } catch (error) {
                return '';
            }
        }

        async function notifyAuthEvent(event, details) {
            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(Object.assign({ action: 'notifyAuthEvent', event: event }, details))
                });
            } catch (error) {
                console.warn('Could not send sign-in security notification.');
            }
        }

        async function getDeviceDetails() {
            let deviceId = localStorage.getItem('p3_security_device_id');
            if (!deviceId || !/^[a-f0-9-]{32,64}$/i.test(deviceId)) {
                deviceId = crypto.randomUUID();
                localStorage.setItem('p3_security_device_id', deviceId);
            }

            const userAgentData = navigator.userAgentData;
            let highEntropy = {};
            if (userAgentData?.getHighEntropyValues) {
                try {
                    highEntropy = await userAgentData.getHighEntropyValues(['model']);
                } catch (error) {
                    console.warn('Could not read the device model for the security notification.', error);
                }
            }
            const userAgent = navigator.userAgent;
            const androidModel = userAgent.match(/\bAndroid [^;)]*;\s*([^;)]+)\s*(?:Build\/[^;)]+)?/i)?.[1]?.trim();
            const model = highEntropy.model || androidModel || (/iPhone|iPad/i.test(userAgent) ? userAgent.match(/iPhone|iPad/i)[0] : '');
            const brands = userAgentData?.brands?.filter(brand => !/not.?a.?brand/i.test(brand.brand)) || [];
            const browser = brands[0]?.brand || (
                /Edg\//.test(userAgent) ? 'Microsoft Edge' :
                /Firefox\//.test(userAgent) ? 'Firefox' :
                /Chrome\//.test(userAgent) ? 'Chrome' :
                /Safari\//.test(userAgent) ? 'Safari' : 'Unknown browser'
            );

            return {
                id: deviceId,
                model: model || (userAgentData?.mobile ? 'Mobile device' : 'Computer'),
                platform: userAgentData?.platform || navigator.platform || 'Unknown platform',
                browser
            };
        }

        function logActivity(username, action, detail, userId, email) {
            var log = JSON.parse(localStorage.getItem('activityLog')) || [];
            log.push({ username: username, userId: userId || '', email: email || '', action: action, detail: detail || '', timestamp: new Date().toISOString() });
            if (log.length > 3000) log = log.slice(log.length - 3000);
            localStorage.setItem('activityLog', JSON.stringify(log));
        }
    </script>
</body>
</html>
