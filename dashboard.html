<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
    :root {
        --green: #0ace14;
        --yellow: #cdfa04;
        --red: #f72702;
        --blue: #0c67cf;
        --dark: #222;
        --muted: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #f2f4f3;
        color: var(--dark);
    }
    .topbar {
        background: linear-gradient(90deg, #0ace14, #cdfa04, #f72702, rgb(90, 172, 101));
        background-size: 400% 400%;
        animation: gradientAnimation 15s ease infinite;
        padding: 18px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #fff;
        text-shadow: 0 1px 3px rgba(0,0,0,0.35);
    }
    @keyframes gradientAnimation {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    .topbar h1 { margin: 0; font-size: 22px; }
    .topbar a.back {
        color: #fff;
        text-decoration: none;
        font-weight: bold;
        background: rgba(0,0,0,0.2);
        padding: 8px 14px;
        border-radius: 6px;
    }
    .topbar a.back:hover { background: rgba(0,0,0,0.35); }

    .wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }

    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-card {
        background: #fff;
        border-radius: 10px;
        padding: 16px 18px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        border-left: 5px solid var(--green);
    }
    .stat-card.yellow { border-left-color: var(--yellow); }
    .stat-card.red { border-left-color: var(--red); }
    .stat-card.blue { border-left-color: var(--blue); }
    .stat-card .num { font-size: 26px; font-weight: bold; }
    .stat-card .label { color: var(--muted); font-size: 13px; margin-top: 4px; }

    .panel {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        padding: 18px 20px;
        margin-bottom: 24px;
    }
    .panel h2 {
        margin: 0 0 14px 0;
        font-size: 17px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .toolbar input[type="text"] {
        flex: 1;
        min-width: 200px;
        padding: 9px 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
    }
    .toolbar select {
        padding: 9px 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
    }
    .btn {
        padding: 9px 14px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        font-size: 13px;
    }
    .btn-primary { background: linear-gradient(90deg, #0ace14, #cdfa04); color: #1b1b1b; }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-muted { background: #eee; color: #333; }
    .btn:hover { filter: brightness(0.95); }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead th {
        text-align: left;
        padding: 10px;
        background: #f7f8f7;
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        border-bottom: 2px solid #eee;
    }
    tbody td { padding: 10px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
    tbody tr:hover { background: #fafdf8; cursor: pointer; }
    tbody tr.selected { background: #eafce9; }

    .badge {
        display: inline-block;
        padding: 3px 9px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: bold;
        color: #fff;
    }
    .badge.login { background: var(--green); }
    .badge.fail { background: var(--red); }
    .badge.reg { background: var(--blue); }
    .badge.other { background: #9ca3af; }

    .row-actions i { margin-right: 12px; cursor: pointer; color: var(--muted); }
    .row-actions i:hover { color: var(--red); }
    .row-actions i.view:hover { color: var(--blue); }

    .empty-state { text-align: center; color: var(--muted); padding: 30px 10px; }

    .modal-overlay {
        display: none;
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.45);
        align-items: center; justify-content: center;
        z-index: 50;
        padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
        background: #fff;
        border-radius: 10px;
        max-width: 560px;
        width: 100%;
        max-height: 80vh;
        overflow-y: auto;
        padding: 22px;
        position: relative;
    }
    .modal-box .close-x {
        position: absolute; top: 14px; right: 16px;
        cursor: pointer; font-size: 20px; color: var(--muted);
    }
    .modal-box h3 { margin-top: 0; }
    .profile-line { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #eee; font-size: 14px; }
    .profile-line b { color: var(--muted); font-weight: 600; }
    .activity-item { padding: 8px 0; border-bottom: 1px solid #f3f3f3; font-size: 13px; }
    .activity-item .meta { color: var(--muted); font-size: 11px; margin-top: 2px; }

    @media (max-width: 640px) {
        thead { display: none; }
        tbody tr { display: block; border-bottom: 8px solid #f2f4f3; }
        tbody td { display: flex; justify-content: space-between; }
        tbody td::before { content: attr(data-label); font-weight: bold; color: var(--muted); }
    }
</style>
<script src="notification.js"></script>
</head>
<body>

<div class="topbar">
    <h1><i class="fas fa-gauge-high"></i> Customer Dashboard</h1>
    <a class="back" href="index.html"><i class="fas fa-arrow-left"></i> Back to App</a>
</div>

<div class="wrap">

    <div class="stats-row" id="statsRow"></div>

    <div class="panel">
        <h2><i class="fas fa-users"></i> Registered Customers</h2>
        <div class="toolbar">
            <input type="text" id="searchInput" placeholder="Search by username or email..." oninput="renderUsers()">
            <select id="sortSelect" title="Sort users" onchange="renderUsers()">
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
                <option value="az">Username A-Z</option>
                <option value="active">Most active</option>
            </select>
            <button class="btn btn-muted" onclick="exportUsersCSV()"><i class="fas fa-file-export"></i> Export CSV</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Registered</th>
                    <th>Last Activity</th>
                    <th>Events</th>
                    <th>Status</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
        </table>
        <div id="usersEmptyState" class="empty-state" style="display:none;">No registered customers yet.</div>
    </div>

    <div class="panel">
        <h2><i class="fas fa-clock-rotate-left"></i> Recent Activity (All Customers)</h2>
        <div class="toolbar">
            <select id="actionFilter" title="Filter activity log" onchange="renderActivityFeed()">
                <option value="all">All actions</option>
                <option value="Registered">Registered</option>
                <option value="Logged In">Logged In</option>
                <option value="Failed Login">Failed Login</option>
            </select>
            <button class="btn btn-danger" onclick="clearActivityLog()"><i class="fas fa-trash"></i> Clear Log</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>When</th>
                    <th>Customer</th>
                    <th>Action</th>
                    <th>Detail</th>
                </tr>
            </thead>
            <tbody id="activityTableBody"></tbody>
        </table>
        <div id="activityEmptyState" class="empty-state" style="display:none;">No activity recorded yet.</div>
    </div>

</div>

<!-- Customer detail modal -->
<div class="modal-overlay" id="userModal">
    <div class="modal-box" onclick="event.stopPropagation()">
        <span class="close-x" onclick="closeUserModal()">&times;</span>
        <h3 id="modalUserTitle"><i class="fas fa-id-card"></i> Customer Details</h3>
        <div id="modalProfileInfo"></div>
        <h4 style="margin-top:18px;"><i class="fas fa-list"></i> Activity History</h4>
        <div id="modalActivityList"></div>
    </div>
</div>

<script>
    function getUsers() { return JSON.parse(localStorage.getItem('registeredUsers')) || []; }
    function setUsers(u) { localStorage.setItem('registeredUsers', JSON.stringify(u)); }
    function getLog() { return JSON.parse(localStorage.getItem('activityLog')) || []; }
    function setLog(l) { localStorage.setItem('activityLog', JSON.stringify(l)); }

    function fmtDate(iso) {
        if (!iso) return '—';
        var d = new Date(iso);
        if (isNaN(d.getTime())) return '—';
        return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function activityCountFor(username) {
        return getLog().filter(function (e) { return e.username && e.username.toLowerCase() === username.toLowerCase(); }).length;
    }

    function lastActivityFor(username) {
        var entries = getLog().filter(function (e) { return e.username && e.username.toLowerCase() === username.toLowerCase(); });
        if (!entries.length) return null;
        entries.sort(function (a, b) { return new Date(b.timestamp) - new Date(a.timestamp); });
        return entries[0];
    }

    function renderStats() {
        var users = getUsers();
        var log = getLog();
        var today = new Date(); today.setHours(0,0,0,0);
        var activeToday = log.filter(function (e) {
            var d = new Date(e.timestamp);
            return d >= today && (e.action === 'Logged In');
        });
        var uniqueActiveToday = new Set(activeToday.map(function (e) { return e.username; })).size;
        var failedLogins = log.filter(function (e) { return e.action === 'Failed Login'; }).length;

        document.getElementById('statsRow').innerHTML = [
            '<div class="stat-card blue"><div class="num">' + users.length + '</div><div class="label">Registered Customers</div></div>',
            '<div class="stat-card"><div class="num">' + uniqueActiveToday + '</div><div class="label">Active Today</div></div>',
            '<div class="stat-card yellow"><div class="num">' + log.length + '</div><div class="label">Total Activity Events</div></div>',
            '<div class="stat-card red"><div class="num">' + failedLogins + '</div><div class="label">Failed Login Attempts</div></div>'
        ].join('');
    }

    function renderUsers() {
        var users = getUsers();
        var search = document.getElementById('searchInput').value.trim().toLowerCase();
        var sort = document.getElementById('sortSelect').value;

        if (search) {
            users = users.filter(function (u) {
                return u.username.toLowerCase().includes(search) || u.email.toLowerCase().includes(search);
            });
        }

        users = users.map(function (u) {
            return Object.assign({}, u, { _count: activityCountFor(u.username), _last: lastActivityFor(u.username) });
        });

        if (sort === 'newest') users.sort(function (a, b) { return new Date(b.createdAt || 0) - new Date(a.createdAt || 0); });
        else if (sort === 'oldest') users.sort(function (a, b) { return new Date(a.createdAt || 0) - new Date(b.createdAt || 0); });
        else if (sort === 'az') users.sort(function (a, b) { return a.username.localeCompare(b.username); });
        else if (sort === 'active') users.sort(function (a, b) { return b._count - a._count; });

        var tbody = document.getElementById('usersTableBody');
        var empty = document.getElementById('usersEmptyState');

        if (!users.length) {
            tbody.innerHTML = '';
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';

        tbody.innerHTML = users.map(function (u) {
            var isOnline = localStorage.getItem('currentUser') &&
                JSON.parse(localStorage.getItem('currentUser')).username === u.username &&
                localStorage.getItem('isLoggedIn') === 'true';
            var statusBadge = isOnline
                ? '<span class="badge login">Online</span>'
                : '<span class="badge other">Offline</span>';
            return '<tr onclick="openUserModal(\'' + escapeAttr(u.username) + '\')">' +
                '<td data-label="Username"><b>' + escapeHtml(u.username) + '</b></td>' +
                '<td data-label="Email">' + escapeHtml(u.email) + '</td>' +
                '<td data-label="Registered">' + fmtDate(u.createdAt) + '</td>' +
                '<td data-label="Last Activity">' + (u._last ? fmtDate(u._last.timestamp) : '—') + '</td>' +
                '<td data-label="Events">' + u._count + '</td>' +
                '<td data-label="Status">' + statusBadge + '</td>' +
                '<td class="row-actions" onclick="event.stopPropagation()">' +
                    '<i class="fas fa-eye view" title="View details" onclick="openUserModal(\'' + escapeAttr(u.username) + '\')"></i>' +
                    '<i class="fas fa-trash" title="Delete customer" onclick="deleteUser(\'' + escapeAttr(u.username) + '\')"></i>' +
                '</td>' +
            '</tr>';
        }).join('');
    }

    function renderActivityFeed() {
        var log = getLog().slice().sort(function (a, b) { return new Date(b.timestamp) - new Date(a.timestamp); });
        var filter = document.getElementById('actionFilter').value;
        if (filter !== 'all') log = log.filter(function (e) { return e.action === filter; });
        log = log.slice(0, 100);

        var tbody = document.getElementById('activityTableBody');
        var empty = document.getElementById('activityEmptyState');

        if (!log.length) {
            tbody.innerHTML = '';
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';

        tbody.innerHTML = log.map(function (e) {
            return '<tr>' +
                '<td data-label="When">' + fmtDate(e.timestamp) + '</td>' +
                '<td data-label="Customer">' + escapeHtml(e.username || '—') + '</td>' +
                '<td data-label="Action">' + actionBadge(e.action) + '</td>' +
                '<td data-label="Detail">' + escapeHtml(e.detail || '') + '</td>' +
            '</tr>';
        }).join('');
    }

    function actionBadge(action) {
        var cls = 'other';
        if (action === 'Logged In') cls = 'login';
        else if (action === 'Failed Login') cls = 'fail';
        else if (action === 'Registered') cls = 'reg';
        return '<span class="badge ' + cls + '">' + escapeHtml(action || 'Activity') + '</span>';
    }

    function openUserModal(username) {
        var user = getUsers().find(function (u) { return u.username === username; });
        if (!user) return;
        document.getElementById('modalUserTitle').innerHTML = '<i class="fas fa-id-card"></i> ' + escapeHtml(user.username);

        document.getElementById('modalProfileInfo').innerHTML =
            '<div class="profile-line"><b>Email</b><span>' + escapeHtml(user.email) + '</span></div>' +
            '<div class="profile-line"><b>Registered</b><span>' + fmtDate(user.createdAt) + '</span></div>' +
            '<div class="profile-line"><b>Total Events</b><span>' + activityCountFor(user.username) + '</span></div>';

        var entries = getLog().filter(function (e) { return e.username && e.username.toLowerCase() === user.username.toLowerCase(); })
            .sort(function (a, b) { return new Date(b.timestamp) - new Date(a.timestamp); });

        var list = document.getElementById('modalActivityList');
        list.innerHTML = entries.length ? entries.map(function (e) {
            return '<div class="activity-item">' + actionBadge(e.action) + ' ' + escapeHtml(e.detail || '') +
                '<div class="meta">' + fmtDate(e.timestamp) + '</div></div>';
        }).join('') : '<p style="color:#6b7280;font-size:13px;">No activity recorded for this customer yet.</p>';

        document.getElementById('userModal').classList.add('show');
    }

    function closeUserModal() { document.getElementById('userModal').classList.remove('show'); }
    document.getElementById('userModal').addEventListener('click', closeUserModal);

    function deleteUser(username) {
        if (!confirm('Delete customer "' + username + '" and all their activity history? This cannot be undone.')) return;
        var users = getUsers().filter(function (u) { return u.username !== username; });
        setUsers(users);
        var log = getLog().filter(function (e) { return e.username !== username; });
        setLog(log);
        if (localStorage.getItem('currentUser')) {
            var cu = JSON.parse(localStorage.getItem('currentUser'));
            if (cu && cu.username === username) {
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('currentUser');
            }
        }
        renderAll();
    }

    function clearActivityLog() {
        if (!confirm('Clear the entire activity log for all customers? This cannot be undone.')) return;
        setLog([]);
        renderAll();
    }

    function exportUsersCSV() {
        var users = getUsers();
        if (!users.length) { alert('No customers to export.'); return; }
        var rows = [['Username', 'Email', 'Registered', 'Last Activity', 'Total Events']];
        users.forEach(function (u) {
            var last = lastActivityFor(u.username);
            rows.push([u.username, u.email, fmtDate(u.createdAt), last ? fmtDate(last.timestamp) : '', activityCountFor(u.username)]);
        });
        var csv = rows.map(function (r) { return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
        var blob = new Blob([csv], { type: 'text/csv' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'registered_customers.csv';
        a.click();
    }

    function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
        });
    }
    function escapeAttr(s) { return escapeHtml(s).replace(/'/g, "&#39;"); }

    function renderAll() {
        renderStats();
        renderUsers();
        renderActivityFeed();
    }

    renderAll();
</script>
</body>
</html>
