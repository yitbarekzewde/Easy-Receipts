<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email</title>
    <style>
        :root { color-scheme: light; font-family: Arial, sans-serif; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef4f1; color: #17352d; }
        .card { width: min(420px, calc(100% - 40px)); padding: 32px; background: #fff; border: 1px solid #d6e2dc; border-radius: 12px; box-shadow: 0 14px 34px rgba(23, 53, 45, .12); }
        h1 { margin-top: 0; }
        p { line-height: 1.5; color: #52645e; }
        label { display: block; margin: 18px 0 6px; font-weight: 700; }
        input, button { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 7px; font: inherit; }
        input { border: 1px solid #b8c9c1; }
        button { margin-top: 16px; border: 0; background: #176b52; color: #fff; font-weight: 700; cursor: pointer; }
        button:disabled { opacity: .6; cursor: wait; }
        #status { min-height: 24px; margin-top: 16px; font-weight: 700; }
        .error { color: #a33a31; }
        .success { color: #176b52; }
    </style>
<script src="notification.js"></script>
</head>
<body>
    <main class="card">
        <h1>Verify your email</h1>
        <p>Check your inbox and click the verification link before signing in.</p>
        <form id="resend-form">
            <label for="email">Email address</label>
            <input id="email" type="email" autocomplete="email" required>
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" required>
            <button id="resend-button" type="submit">Resend verification email</button>
        </form>
        <div id="status" aria-live="polite"></div>
        <p><a href="login.html">Back to login</a></p>
    </main>
    <script type="module">
        import { auth } from './firebase-config.js';
        import { reload, sendEmailVerification, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js';

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const status = document.getElementById('status');
        const pendingEmail = localStorage.getItem('pendingVerificationEmail') || '';
        emailInput.value = pendingEmail;

        if (new URLSearchParams(window.location.search).has('verified')) {
            localStorage.removeItem('pendingVerificationEmail');
            passwordInput.closest('form').hidden = true;
            showStatus('Your email has been verified. You can now sign in.', false);
        } else if (new URLSearchParams(window.location.search).has('sendFailed')) {
            showStatus('We could not send the verification email. Enter your password to try again.', true);
        }

        document.getElementById('resend-form').addEventListener('submit', async function (event) {
            event.preventDefault();
            setBusy(true);
            let signedInUser = null;
            try {
                const credential = await signInWithEmailAndPassword(auth, emailInput.value.trim(), passwordInput.value);
                signedInUser = credential.user;
                await reload(signedInUser);
                if (signedInUser.emailVerified) {
                    localStorage.removeItem('pendingVerificationEmail');
                    showStatus('This email is already verified. You can sign in.', false);
                    return;
                }
                await sendEmailVerification(signedInUser, {
                    url: new URL('email-verification.html?verified=1', window.location.href).toString()
                });
                localStorage.setItem('pendingVerificationEmail', emailInput.value.trim());
                showStatus('A verification link was sent. Check your inbox and click the link before signing in.', false);
            } catch (error) {
                showStatus(getResendErrorMessage(error), true);
            } finally {
                passwordInput.value = '';
                if (signedInUser && auth.currentUser) {
                    try {
                        await signOut(auth);
                    } catch (error) {
                        console.error('Could not sign out after sending verification email.', error);
                        showStatus('The verification email was sent, but signing out failed. Please sign out before continuing.', true);
                    }
                }
                setBusy(false);
            }
        });

        function getResendErrorMessage(error) {
            if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                return 'The email or password is incorrect.';
            }
            if (error.code === 'auth/too-many-requests') return 'Too many attempts. Please wait and try again later.';
            return error.message || 'Could not resend the verification email. Please try again.';
        }

        function setBusy(isBusy) {
            document.getElementById('resend-button').disabled = isBusy;
        }

        function showStatus(message, isError) {
            status.textContent = message;
            status.className = isError ? 'error' : 'success';
        }
    </script>
</body>
</html>
