<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Login / Register</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(90deg, #0ace14, #cdfa04, #f72702, rgb(90, 172, 101));
            background-size: 400% 400%;
            animation: gradientAnimation 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-shadow: inset -10px 30px 60px rgba(39, 4, 240, 0.1);        
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .left-navigation-arrow {
            position: absolute;
            top: 20px;
            left: 20px;
            cursor: pointer;
            color: #cdfa06ef;
        }

        h1 {
            color: #333;
            font-weight: bold;
        }

        label {
            display: flex;
            margin-bottom: 2px;
            color: #0c67cf;
            font-weight: bold;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: large;
            margin-top: 10px;
        }

        .auth-form {
            background: rgba(235, 238, 236, 0.9);
            padding: 40px;
            border-radius: 10px;
            border-start-start-radius: 70px;
            border-bottom-right-radius: 70px;
            box-shadow: inset 0 0 100px rgba(7, 31, 243, 0.925), 0 0 20px rgba(241, 3, 3, 0.1);
            width: 300px;
            text-align: center;
        }

        .auth-form h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .auth-form input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .auth-form input:focus {
            border-color: #007bff;
            outline: none;
        }

        .auth-form button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(90deg, #0ace14, #cdfa04, #f72702, rgb(30, 248, 40));
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 19px;
            margin-top: 20px;
        }

        .auth-form button:hover {
            background: #f71303;
        }

        /* Utility class to hide sections smoothly */
        .hidden {
            display: none;
        }
    </style>
<script src="notification.js"></script>
</head>
<body>
    <i class="left-navigation-arrow" onclick="window.location.href='index.html'">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-arrow-left">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </i>

    <div class="auth-form">
        <h1>Secure Login</h1>
        
        <!-- Step 1: Phone Number Input -->
        <div id="phone-section">
            <label for="phoneNumber">Phone Number</label>
            <input type="tel" id="phoneNumber" placeholder="+27 82 123 4567" required>
            <button id="sendOtpBtn">Send OTP</button>
        </div>

        <!-- Step 2: OTP Code Input (Hidden by default) -->
        <div id="otp-section" class="hidden">
            <label for="otpCode">Enter 6-Digit Code</label>
            <input type="text" id="otpCode" placeholder="123456" required>
            <button id="verifyOtpBtn">Verify & Login</button>
        </div>

        <!-- Required for Firebase reCAPTCHA -->
        <div id="recaptcha-container"></div>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDTqPEj3EXTlAvHW6H2-O1u78dSIEHHggo",
            authDomain: "receipts-eccf0.firebaseapp.com",
            projectId: "receipts-eccf0",
            storageBucket: "receipts-eccf0.firebasestorage.app",
            messagingSenderId: "1012779995675",
            appId: "1:1012779995675:web:6dc991f5123f322d7b9ebe",
            measurementId: "G-E5LZ9XYVJH"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // 1. Setup Invisible reCAPTCHA (Firebase requires this to prevent spam bots)
        window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
            'size': 'invisible',
            'callback': (response) => {
                // reCAPTCHA solved automatically
            }
        });

        // 2. Handle Sending the OTP
        document.getElementById('sendOtpBtn').addEventListener('click', () => {
            const phoneNumber = document.getElementById('phoneNumber').value.trim();

            // Phone numbers must include the country code (+27)
            if (!phoneNumber.startsWith('+')) {
                alert("Please include your country code (e.g., +27)");
                return;
            }

            const appVerifier = window.recaptchaVerifier;

            signInWithPhoneNumber(auth, phoneNumber, appVerifier)
                .then((confirmationResult) => {
                    // SMS sent successfully
                    window.confirmationResult = confirmationResult;
                    
                    // Hide phone input, show OTP input
                    document.getElementById('phone-section').classList.add('hidden');
                    document.getElementById('otp-section').classList.remove('hidden');
                    
                    alert("OTP sent to your phone!");
                }).catch((error) => {
                    console.error("SMS not sent", error);
                    alert("Error sending SMS: " + error.message);
                    // Reset reCAPTCHA so they can try again
                    window.recaptchaVerifier.render().then(function(widgetId) {
                        grecaptcha.reset(widgetId);
                    });
                });
        });

        // 3. Handle Verifying the OTP
        document.getElementById('verifyOtpBtn').addEventListener('click', () => {
            const code = document.getElementById('otpCode').value.trim();

            if (code.length === 0) {
                alert("Please enter the code.");
                return;
            }

            window.confirmationResult.confirm(code)
                .then((result) => {
                    // User signed in successfully
                    const user = result.user;
                    console.log("Logged in successfully as:", user.phoneNumber);
                    window.location.href = 'index.html'; 
                }).catch((error) => {
                    // User couldn't sign in (bad verification code?)
                    alert("Invalid code. Please try again.");
                });
        });
    </script>
</body>
</html>
