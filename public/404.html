<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Easy Receipt</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root { --primary: #f97316; --dark: #0f172a; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f1f5f9;
            color: var(--dark);
        }
        .error-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .error-card {
            background: #fff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            max-width: 480px;
            width: 100%;
        }
        .error-icon-wrapper { position: relative; display: inline-block; margin-bottom: 20px; }
        .error-code {
            font-size: 90px;
            font-weight: 800;
            color: #e2e8f0;
            line-height: 1;
            margin: 0;
            letter-spacing: -2px;
        }
        .receipt-lost-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -40%);
            font-size: 45px;
            color: var(--primary);
            animation: floatReceipt 3s ease-in-out infinite;
        }
        @keyframes floatReceipt {
            0%, 100% { transform: translate(-50%, -40%) rotate(0deg); }
            50% { transform: translate(-50%, -60%) rotate(5deg); }
        }
        .error-title { font-size: 24px; margin: 0 0 10px; font-weight: 700; }
        .error-message { color: #64748b; font-size: 15px; line-height: 1.6; margin: 0 0 30px; }
        .error-actions { display: flex; flex-direction: column; gap: 12px; }
        .btn-error-primary, .btn-error-secondary {
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
            width: 100%;
            margin: 0;
        }
        .btn-error-primary { background: var(--primary); color: #fff; border: none; }
        .btn-error-primary:hover { filter: brightness(1.05); }
        .btn-error-secondary { background: #f8fafc; color: #475569; border: 1px solid #e2e8f0; }
        .btn-error-secondary:hover { background: #f1f5f9; }
        .error-footer { margin-top: 30px; color: #94a3b8; font-size: 13px; }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-card">
            <div class="error-icon-wrapper">
                <h1 class="error-code">404</h1>
                <i class="fas fa-file-invoice receipt-lost-icon"></i>
            </div>
            <h2 class="error-title">Page Not Found</h2>
            <p class="error-message">
                The page you are looking for doesn't exist or has been moved.
            </p>
            <div class="error-actions">
                <a href="/index.html" class="btn-error-primary">
                    <i class="fas fa-home"></i> Back to Home
                </a>
                <button type="button" onclick="history.length > 1 ? history.back() : (location.href = '/index.html')" class="btn-error-secondary">
                    <i class="fas fa-arrow-left"></i> Go Back
                </button>
            </div>
        </div>
        <p class="footer error-footer">© 2026 Easy Receipt</p>
    </div>
</body>
</html>
