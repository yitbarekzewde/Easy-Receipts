<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(90deg, #0ace14, #cdfa04, #f72702, rgb(90, 172, 101));
            background-size: 400% 400%;
            animation: gradientAnimation 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-shadow: inset -10px 30px 60px rgba(39, 4, 240, 0.1);         
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            -100% { background-position: 0% 50%; }
        }
        .left-navigation-arrow {
        position: absolute;
        top: 20px;
        left: 20px;
        cursor: pointer;
        color: #cdfa06ef;
    }
        h1 {
            color: #333;
            font-weight: bold;
        }

        label {
            display: flex;
            margin-bottom: 2px;
            color: #0c67cf;
            font-weight: bold;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: large;
        }

        .login-form {
            background: rgba(235, 238, 236, 0.9);
            padding: 50px;
            border-radius: 10px;
            border-color: linear-gradient(1800deg, #08fa28, #ffef09 #f70b0b);
            border-start-start-radius: 70px;
            border-bottom-right-radius: 70px;
            box-shadow: 0 0 20px rgba(241, 3, 3, 0.1);
            width: 300px;
            text-align: center;
            box-shadow: inset 0 0 100px rgba(7, 31, 243, 0.925);
            background-color: linear-gradient(180deg, #08fa28, #ffef09 #f70b0b);
            animation: gradientAnimation 15s ease infinite;
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100%  }
            100% { background-position: 50%; }
        }

        .login-form h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .login-form input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;

        }
        .login-form input:focus {
            border-color: #007bff;
            outline: none;
            top: auto;
        }
        .password-field { position: relative; }
        .password-field input { padding-right: 42px; }
        .password-toggle { position: absolute; top: 50%; right: 8px; transform: translateY(-50%); width: 32px !important; height: 32px; margin: 0 !important; padding: 5px !important; background: transparent !important; color: #52606d !important; font-size: 16px !important; }
        .password-toggle:hover { color: #007bff !important; }
        .password-toggle svg { display: block; width: 20px; height: 20px; }

        .login-form button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(90deg, #0ace14, #cdfa04, #f72702, rgb(30, 248, 40));
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 19px;
            margin-top: 15px;
        }


        .login-form button:hover {
            background: #5a6fd8;
        }

        .switch-link {
            display: block;
            margin-top: 15px;
            color: #0c67cf;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .switch-link:hover {
            text-decoration: underline;
        }
    </style>
<script src="notification.js"></script>
</head>
<body>
    <i class="left-navigation-arrow" onclick="window.location.href='index.html'" title="Back to app">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-arrow-left">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </i>
    <div class="login-form">
        <h1>Welcome Back!</h1>
        <h2>Login</h2>
        <form action="#" method="post">
            <label for="username">Email</label>
            <input type="email" name="username" placeholder="you@example.com" required>
            <label for="password">Password </label>
            <div class="password-field">
                <input type="password" name="password" placeholder="Password" required>
                <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
                </button>
            </div>
            <button type="submit">Login</button>
        </form>
        <a class="switch-link" onclick="window.location.href='reg-form.html'">Don't have an account? Register</a>
        <a class="forgatepass" onclick="window.location.href='forgot-password.html'">Forgot Password?</a>
    </div>

    
    <script>
        document.querySelectorAll('.password-toggle').forEach(function (toggle) {
            toggle.addEventListener('click', function () {
                const input = toggle.parentElement.querySelector('input');
                const isVisible = input.type === 'text';
                input.type = isVisible ? 'password' : 'text';
                toggle.setAttribute('aria-label', isVisible ? 'Show password' : 'Hide password');
                toggle.setAttribute('aria-pressed', String(!isVisible));
            });
        });
    </script>
    <script type="module">
        import { auth } from './firebase-config.js';
        import { signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js';

        //check if the user is already logged in and redirect straight into the app if they are
        if (localStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = 'index.html';
        }

        // Add JavaScript for form validation and credential checking
        document.querySelector('form').addEventListener('submit', function(event) {
            event.preventDefault();

            var username = document.querySelector('input[name="username"]').value.trim();
            var password = document.querySelector('input[name="password"]').value;

            if (username === '' || password === '') {
                alert('Please fill in all fields.');
                return;
            }

            signIn(username, password);
        });

        async function signIn(email, password) {
            try {
                var credential = await signInWithEmailAndPassword(auth, email, password);
                var verifiedEmail = localStorage.getItem('verifiedEmail');
                if (verifiedEmail !== credential.user.email) {
                    await signOut(auth);
                    localStorage.setItem('pendingVerificationEmail', credential.user.email);
                    alert('Please verify your email before logging in.');
                    window.location.href = 'email-verification.html';
                    return;
                }
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('currentUser', JSON.stringify({ username: credential.user.displayName || credential.user.email, email: credential.user.email }));
                localStorage.setItem('p3_user_profile', JSON.stringify({
                    name: credential.user.displayName || credential.user.email,
                    email: credential.user.email,
                    provider: 'email'
                }));
                logActivity(credential.user.email, 'Logged In', 'Signed in successfully');
                window.location.href = 'index.html';
            } catch (error) {
                logActivity(email, 'Failed Login', 'Incorrect email or password');
                alert('Incorrect email or password. Please try again.');
            }
        }

        function logActivity(username, action, detail) {
            var log = JSON.parse(localStorage.getItem('activityLog')) || [];
            log.push({ username: username, action: action, detail: detail || '', timestamp: new Date().toISOString() });
            if (log.length > 1000) log = log.slice(log.length - 1000);
            localStorage.setItem('activityLog', JSON.stringify(log));
        }
    </script>
</body>
</html>
