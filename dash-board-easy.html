<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Receipt | Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary: #0ace14;
            --bg: #f4f7f6;
            --text: #333;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        [hidden] {
            display: none !important;
        }

        .auth-gate {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            box-sizing: border-box;
        }

        .auth-card {
            width: min(100%, 390px);
            padding: 32px;
            box-sizing: border-box;
            border-radius: 15px;
            background: white;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        .auth-card h2 {
            margin: 0 0 8px;
        }

        .auth-card p {
            color: #666;
            line-height: 1.5;
        }

        .auth-card label {
            display: block;
            margin: 18px 0 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .auth-card input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font: inherit;
        }

        .auth-submit,
        .btn-sign-out {
            border: 0;
            border-radius: 7px;
            padding: 11px 16px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .auth-submit {
            width: 100%;
            margin-top: 20px;
            background: var(--primary);
            color: #000;
        }

        .auth-submit:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        .auth-status {
            margin: 12px 0 0;
            color: #b42318 !important;
            font-size: 13px;
        }

        .auth-links {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 20px;
            font-size: 13px;
        }

        .auth-links a,
        .auth-back-link {
            color: #166534;
        }

        .auth-back-link {
            display: block;
            margin-top: 18px;
            text-align: center;
            font-size: 13px;
        }

        /* Professional Topbar */
        .topbar {
            background: #1a1a1a;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .topbar h1 {
            font-size: 18px;
            margin: 0;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-back {
            background: var(--primary);
            color: #000;
            padding: 8px 16px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
        }

        .btn-sign-out {
            background: transparent;
            color: white;
            border: 1px solid #777;
        }

        .wrap {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Stats Row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .stat-card .num {
            font-size: 24px;
            font-weight: 800;
            display: block;
        }

        .stat-card .label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
        }

        /* Panels */
        .panel {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            color: #888;
            font-size: 12px;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        td {
            padding: 15px 12px;
            border-bottom: 1px solid #f9f9f9;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
        }

        .modal-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 500px;
        }
    </style>
</head>

<body>
    <main class="auth-gate" id="dashboardAuthGate">
        <section class="auth-card" aria-labelledby="dashboardAuthTitle">
            <h2 id="dashboardAuthTitle"><i class="fas fa-lock" aria-hidden="true"></i> System Admin Sign In</h2>
            <p>Sign in with your verified Easy Receipt email and password to continue.</p>
            <form id="dashboardAuthForm">
                <label for="dashboardEmail">Email</label>
                <input type="email" id="dashboardEmail" name="email" autocomplete="username" required>
                <label for="dashboardPassword">Password</label>
                <input type="password" id="dashboardPassword" name="password" autocomplete="current-password" required>
                <p class="auth-status" id="dashboardAuthStatus" role="status" aria-live="polite" hidden></p>
                <button class="auth-submit" id="dashboardAuthSubmit" type="submit">Sign in</button>
            </form>
            <div class="auth-links">
                <a href="reg-form.html">Set up an account</a>
                <a href="forgot-password.html">Forgot password?</a>
            </div>
            <a class="auth-back-link" href="index.html">Back to Easy Receipt</a>
        </section>
    </main>

    <div id="adminDashboard" hidden>
        <div class="topbar">
            <h1><i class="fas fa-shield-alt"></i> SYSTEM ADMIN</h1>
            <div class="topbar-actions">
                <a class="btn-back" href="index.html">Back to App</a>
                <button class="btn-sign-out" id="dashboardSignOut" type="button">Sign out</button>
            </div>
        </div>

        <div class="wrap">
            <div class="stats-row" id="statsRow"></div>

            <div class="panel">
                <div class="panel-header">
                    <h2>Customer Directory</h2>
                </div>
                <table id="usersTable">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Email</th>
                            <th>Registered</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody"></tbody>
                </table>
                <div id="usersEmptyState" class="empty-state" style="display:none;">No customers found.</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth } from './firebase-config.js';
        import {
            onAuthStateChanged,
            signInWithEmailAndPassword,
            signOut
        } from 'https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js';

        const authGate = document.getElementById('dashboardAuthGate');
        const dashboard = document.getElementById('adminDashboard');
        const authForm = document.getElementById('dashboardAuthForm');
        const authStatus = document.getElementById('dashboardAuthStatus');
        const authSubmit = document.getElementById('dashboardAuthSubmit');
        const passwordInput = document.getElementById('dashboardPassword');

        function showAuthMessage(message) {
            authStatus.textContent = message;
            authStatus.hidden = !message;
        }

        function showDashboard(user) {
            authGate.hidden = Boolean(user);
            dashboard.hidden = !user;
        }

        function getSignInErrorMessage(error) {
            if (error.code === 'auth/invalid-credential' || error.code === 'auth/invalid-login-credentials') {
                return 'Email or password is incorrect. Please try again.';
            }
            if (error.code === 'auth/too-many-requests') {
                return 'Too many sign-in attempts. Please wait and try again.';
            }
            if (error.code === 'auth/network-request-failed') {
                return 'Could not connect. Check your internet connection and try again.';
            }
            if (error.code === 'auth/user-disabled') {
                return 'This account has been disabled. Contact support for help.';
            }
            return 'Could not sign in. Please try again later.';
        }

        onAuthStateChanged(auth, user => {
            const verifiedUser = user?.emailVerified ? user : null;
            showDashboard(verifiedUser);
            if (user && !verifiedUser) {
                void signOut(auth).catch(error => {
                    console.error('Could not sign out the unverified dashboard account.', error);
                    showAuthMessage('This account must verify its email before using the dashboard. Sign out from the app and try again.');
                });
                showAuthMessage('Please verify your email address before signing in.');
            } else if (verifiedUser) {
                showAuthMessage('');
            }
        }, error => {
            console.error('Could not determine dashboard sign-in state.', error);
            showDashboard(null);
            showAuthMessage('Could not check your sign-in status. Reload the page and try again.');
        });

        authForm.addEventListener('submit', async event => {
            event.preventDefault();
            if (authSubmit.disabled) return;
            authSubmit.disabled = true;
            authSubmit.textContent = 'Signing in...';
            showAuthMessage('');

            try {
                const credential = await signInWithEmailAndPassword(
                    auth,
                    document.getElementById('dashboardEmail').value.trim(),
                    passwordInput.value
                );
                if (!credential.user.emailVerified) {
                    await signOut(auth);
                    showAuthMessage('Please verify your email address before signing in.');
                    return;
                }
                passwordInput.value = '';
            } catch (error) {
                console.error('Dashboard sign-in failed.', error);
                showAuthMessage(getSignInErrorMessage(error));
            } finally {
                authSubmit.disabled = false;
                authSubmit.textContent = 'Sign in';
            }
        });

        document.getElementById('dashboardSignOut').addEventListener('click', async () => {
            try {
                await signOut(auth);
                passwordInput.value = '';
                showAuthMessage('');
            } catch (error) {
                console.error('Could not sign out of the dashboard.', error);
                window.alert('Could not sign out. Please try again.');
            }
        });
    </script>
</body>

</html>
