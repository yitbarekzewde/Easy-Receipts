<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Receipt | Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary: #0ace14;
            --bg: #f4f7f6;
            --text: #333;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        /* Professional Topbar */
        .topbar {
            background: #1a1a1a;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .topbar h1 {
            font-size: 18px;
            margin: 0;
        }

        .btn-back {
            background: var(--primary);
            color: #000;
            padding: 8px 16px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
        }

        .wrap {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Stats Row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .stat-card .num {
            font-size: 24px;
            font-weight: 800;
            display: block;
        }

        .stat-card .label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
        }

        /* Panels */
        .panel {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            color: #888;
            font-size: 12px;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        td {
            padding: 15px 12px;
            border-bottom: 1px solid #f9f9f9;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
        }

        .modal-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 500px;
        }
    </style>
</head>

<body>

    <div class="topbar">
        <h1><i class="fas fa-shield-alt"></i> SYSTEM ADMIN</h1>
        <a class="btn-back" href="index.html">Back to App</a>
    </div>

    <div class="wrap">
        <div class="stats-row" id="statsRow"></div>

        <div class="panel">
            <div class="panel-header">
                <h2>Customer Directory</h2>
                <button class="btn" onclick="renderAll()"><i class="fas fa-sync"></i> Refresh Data</button>
            </div>
            <table id="usersTable">
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Email</th>
                        <th>Registered</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody"></tbody>
            </table>
            <div id="usersEmptyState" class="empty-state" style="display:none;">No customers found.</div>
        </div>
    </div>

    <script>
        // ... (Use your existing data functions getUsers, getLog, etc here)

        function renderAll() {
            renderStats();
            renderUsers();
            // ... include rest of your rendering logic
        }

        // Call render on load
        renderAll();
    </script>
</body>

</html>
